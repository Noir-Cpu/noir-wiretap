version: 2

sources:
  - name: github
    description: GitHub REST API activity for the Noir-Cpu `noir-*` repos, loaded by dlt (pipeline/github_source.py).
    schema: raw_github
    tables:
      - name: repos
        description: One row per repo, replaced on every load, so its load time is the pipeline's heartbeat.
        loaded_at_field: "to_timestamp(cast(_dlt_load_id as double))"
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 30, period: hour}
      - name: commits
      - name: workflow_runs
      - name: pull_requests
      - name: releases
        description: Not created by dlt until the first release exists; staging falls back to an empty relation.

  - name: informant
    description: Match results from the public noir-informant repo (data/results), loaded by dlt.
    schema: raw_informant
    tables:
      - name: results
        description: One row per match, raw strings. Only result and match-statistics columns are kept, never odds.
      - name: collector_manifest
        description: >
          The collector's own manifest (data/manifest.json). `fetched_at` is when the INFORMANT collector last
          fetched each file, so this checks the upstream collector, not just our load.
        loaded_at_field: fetched_at
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 26, period: hour}
      - name: predictions
        description: >
          Hash-chained prediction ledger (predictions/ledger.jsonl in noir-informant), one row per published
          prediction. dlt creates the table only once the ledger has rows; staging falls back to an empty relation.
          No freshness rule: the ledger is legitimately silent between matchdays.
      - name: skipped_predictions
        description: >
          predictions/skipped.jsonl: matches first seen under 2 hours before kickoff, with a reason. Same shape as
          the ledger plus `reason`. Not scored; counted so the report can show coverage.

  - name: witness
    description: >
      FUTURE, AGGREGATES ONLY. Per-poll turnout and hour-bucketed cast counts exported by WITNESS.
      Ballots and participation records never enter the warehouse (docs/adr/0003-witness-aggregates-only.md).
    tables:
      - name: poll_turnout
