version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    # Major upgrades are done by hand, one at a time.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      pip:
        patterns: ["*"]
  # Deploy and test tooling: wrangler, Playwright, axe.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      tooling:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /report
    schedule: { interval: weekly }
    ignore:
      # @evidence-dev/evidence peers on exactly typescript 5.4.2.
      - dependency-name: "typescript"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
