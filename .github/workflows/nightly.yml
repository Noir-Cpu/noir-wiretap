name: Nightly
# Rebuilds the warehouse and publishes the Evidence site. Commits nothing to main.
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write # cache save
concurrency: { group: nightly, cancel-in-progress: false }
jobs:
  nightly:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: report/package-lock.json }
      # The warehouse file carries dlt incremental state and the repo snapshot history (SCD type 2).
      # The cache is best-effort: if it is evicted, history restarts. See docs/adr/0006-warehouse-state-in-actions-cache.md.
      - uses: actions/cache/restore@v4
        id: warehouse
        with:
          path: warehouse
          key: warehouse-${{ github.run_id }}
          restore-keys: warehouse-
      - run: make setup
      - run: make extract
      # Fails the workflow (and skips the deploy) if INFORMANT's collector or our GitHub load is older than its threshold.
      - run: make freshness
      - run: make build
      - uses: actions/cache/save@v4
        with:
          path: warehouse
          key: warehouse-${{ github.run_id }}
      - run: make site
      - name: Deploy to Cloudflare Workers assets
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy
      - name: Deploy skipped
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set, site built but not deployed. See docs/SETUP.md."
