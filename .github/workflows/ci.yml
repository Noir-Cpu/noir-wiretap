name: CI
on:
  push:
    branches: [main]
  pull_request:
# Least privilege: every job gets a read-only token unless it asks for more.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            report/package-lock.json
            package-lock.json
      - run: make setup
      - run: make test
      # Only the extract step talks to the GitHub API, so only it gets the (read-only) token.
      - run: make run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: make site
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Headers, CSP violations, accessibility (axe), SEO tags and the gated explorer, against wrangler dev serving site/.
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22 }
      # Python: pinned requirements and everything they pull in. Fails on any known advisory.
      - run: pip install pip-audit==2.10.1 && pip-audit -r requirements.txt
      # Tooling that deploys and tests the site: fails on high or critical.
      - run: npm audit --audit-level=high
      # Evidence's build toolchain has advisories with no upstream fix (see docs/adr/0010). Reported, not blocking.
      - run: npm audit --prefix report --audit-level=critical
        continue-on-error: true
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
